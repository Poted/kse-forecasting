# Codzienna prognoza ryzyka nadpodaży na jutro — praca inżynierska (decyzja 16.11.2026).
# Dwa przebiegi dziennie, kod z gałęzi `main`, ta sama baza co P2 (sekret DATABASE_URL):
#  - po prognozie P2 (10:17 UTC): cel 2 — ryzyko ujemnej ceny RCE, z informacji z 12:00 dnia D;
#  - po publikacji planu PSE na D+1 (ok. 16:00 czasu polskiego): cel 1 — ograniczenia PV.
# Polecenie zapisuje tylko brakujące prognozy z danego dnia (cel 2 nie jest nadpisywany po południu).
# Wymaga prognozy P2 na jutro w bazie (workflow „Prognoza na jutro”).
name: Prognoza ryzyka nadpodaży (inż)

on:
  schedule:
    - cron: "47 10 * * *" # 11:47 (zima) / 12:47 (lato) czasu polskiego — cel 2
    - cron: "37 15 * * *" # 16:37 (zima) / 17:37 (lato) czasu polskiego — cel 1
  workflow_dispatch:

concurrency:
  group: prognoza-inz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności (uv.lock)
        run: |
          pip install uv==0.11.32
          uv sync --frozen --no-dev
      - name: Prognoza ryzyka nadpodaży na jutro
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Brak sekretu DATABASE_URL w ustawieniach repozytorium." >&2
            exit 1
          fi
          uv run --no-sync kse-inz forecast
