[project]
name = "kse-forecasting"
version = "0.1.0"
description = "Prognozowanie zapotrzebowania netto i ryzyka nadpodaży energii z PV w KSE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "httpx",
    "sqlalchemy",
    "psycopg[binary]",
    "lightgbm",
    "scikit-learn",
    "holidays",
    "streamlit",
    "plotly",
    "matplotlib>=3.11.2",
]

[project.scripts]
kse-data = "common.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "p2", "inz", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
